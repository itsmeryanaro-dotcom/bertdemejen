<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>For Adik 💌</title>
<link rel="stylesheet" href="index.css">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Titan+One&family=Sriracha&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

  <div class="floating-hearts" aria-hidden="true">
    <i class="fa-solid fa-heart h1"></i>
    <i class="fa-solid fa-heart h2"></i>
    <i class="fa-solid fa-heart h3"></i>
    <i class="fa-solid fa-heart h4"></i>
    <i class="fa-solid fa-heart h5"></i>
  </div>

  <main class="gate">
    <p class="eyebrow">a little something for</p>
    <h1 class="name">Adik</h1>

    <button id="seal" class="seal" type="button" aria-label="Tap to open your birthday surprise">
      <span class="seal-face">
        <i class="fa-solid fa-envelope"></i>
      </span>
      <span class="seal-ring"></span>
    </button>

    <p class="hint"><span class="tap-word">tap the envelope</span> to open your surprise 🎂</p>
  </main>

  <audio id="bgMusic" preload="auto" loop>
    <source src="assets/music/birthday.mp3" type="audio/mpeg">
  </audio>

  <script>
    const seal = document.getElementById('seal');
    const audio = document.getElementById('bgMusic');
    const gate = document.querySelector('.gate');
    let opening = false;

    seal.addEventListener('click', () => {
      if (opening) return;
      opening = true;

      // This click IS the user gesture browsers require, so we start the
      // audio right here. It will keep "counting" as interaction with this
      // page's origin, which is what lets the next page's autoplay succeed.
      audio.volume = 0.6;
      audio.play().catch(() => {
        /* if a browser still refuses, homepage.html will retry on load */
      });

      try {
        sessionStorage.setItem('bdayMusicStarted', '1');
      } catch (e) { /* storage unavailable, silently continue */ }

      seal.classList.add('opened');
      gate.classList.add('leaving');

      setTimeout(() => {
        window.location.href = 'homepage.html';
      }, 850);
    });
  </script>
</body>
</html>
